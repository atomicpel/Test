name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-проект
        run: |
          flutter create --org ru.atomicpel --project-name cycle_app --platforms android .
          rm -f test/widget_test.dart
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="cycle_app"/android:label="Мой цикл"/' $MAN
          grep -q 'permission.INTERNET' $MAN || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MAN
          cat $MAN

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Сборка
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Подпись своим ключом
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks signing/release.jks --ks-key-alias cycle \
            --ks-pass file:signing/pass.txt --key-pass file:signing/pass.txt \
            --out MyCycle.apk build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs MyCycle.apk | head -3
          ls -la MyCycle.apk

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-1.0.${{ github.run_number }}" MyCycle.apk \
            --title "Мой цикл 1.0.${{ github.run_number }}" \
            --notes "Сборка из ${{ github.sha }}"
