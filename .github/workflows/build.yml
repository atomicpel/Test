name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-проект
        run: |
          flutter --version
          flutter create --org ru.atomicpel --project-name cycle_app --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py .
          cat android/app/build.gradle.kts || cat android/app/build.gradle

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Анализ кода
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && exit 0
          cat analyze.txt
          grep -E "^ *error" analyze.txt | head -10 | while read -r l; do echo "::error::$l"; done
          exit 1

      - name: Тесты
        run: |
          flutter test > test.txt 2>&1 && { tail -3 test.txt; exit 0; }
          cat test.txt
          grep -E "Error:|Expected:|Actual:|FAILED|failed" test.txt | head -10 | while read -r l; do echo "::error::$l"; done
          exit 1

      - name: Скриншоты экранов
        continue-on-error: true
        run: |
          cp "$(dirname "$(which flutter)")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" screenshot_test/
          flutter test screenshot_test --update-goldens > shots.txt 2>&1 || true
          tail -40 shots.txt
          ls -la screenshot_test/out || true

      - name: Сборка
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 \
            --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} > build.txt 2>&1 \
            || { tail -80 build.txt; grep -E "^e:|error:|What went wrong" -A3 build.txt | head -20 | while read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.txt
          ls -la build/app/outputs/flutter-apk/

      - name: Подпись своим ключом
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          sign() {
            "$APKSIGNER" sign --ks signing/release.jks --ks-key-alias cycle \
              --ks-pass file:signing/pass.txt --out "$2" "$1"
          }
          sign build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MyCycle.apk
          sign build/app/outputs/flutter-apk/app-x86_64-release.apk MyCycle-x86_64.apk
          "$APKSIGNER" verify MyCycle.apk && "$APKSIGNER" verify MyCycle-x86_64.apk
          ls -la MyCycle*.apk

      - name: Место на диске для эмулятора
        continue-on-error: true
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/share/powershell /usr/share/swift /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /opt/microsoft /opt/google /opt/az /usr/local/julia* || true
          docker system prune -af > /dev/null 2>&1 || true
          rm -rf build/app/intermediates "$HOME/.gradle/caches" || true
          df -h /

      - name: Включить KVM для эмулятора
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверка на эмуляторе Android
        continue-on-error: true
        timeout-minutes: 25
        run: bash tools/emulator.sh MyCycle-x86_64.apk smoke

      - name: Публикация на свой сервер
        if: success()
        continue-on-error: true
        env:
          CYCLE_PUBLISH: ${{ secrets.CYCLE_PUBLISH }}
        run: |
          if [ -z "$CYCLE_PUBLISH" ]; then
            echo "::notice::Секрет CYCLE_PUBLISH не задан — на сервер не выкладываю"; exit 0
          fi
          # не выкладывать версию, которая вылетела на эмуляторе
          if grep -q "AndroidRuntime: Process: ru.atomicpel" smoke/smoke_report.txt 2>/dev/null; then
            echo "::error::Приложение вылетело на эмуляторе — на сервер не выкладываю"; exit 1
          fi
          URL="${CYCLE_PUBLISH%%#*}"; TOK="${CYCLE_PUBLISH#*#}"
          curl -fsS --retry 3 --max-time 300 -X POST "$URL/api/publish" \
            -H "Authorization: Bearer $TOK" \
            -H "X-Version: 1.0.${{ github.run_number }}" \
            -H "X-Build: ${{ github.run_number }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @MyCycle.apk -o publish.txt -w "%{http_code}\n" || { cat publish.txt; echo "::error::Не удалось выложить на сервер"; exit 1; }
          cat publish.txt; echo
          echo "::notice::Выложено на $URL/app"

      - name: Релиз
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-1.0.${{ github.run_number }}"
          if [ -f MyCycle.apk ]; then
            gh release create "$TAG" MyCycle.apk --title "Мой цикл 1.0.${{ github.run_number }}" \
              --notes "Сборка из ${{ github.sha }}"
          else
            gh release create "$TAG" --prerelease --title "Диагностика ${{ github.run_number }}" \
              --notes "Сборка не удалась, только журналы"
          fi
          shopt -s nullglob
          for f in screenshot_test/out/*.png smoke/*.png smoke/smoke_report.txt smoke/emu_setup.txt smoke/logcat_full.txt shots.txt analyze.txt test.txt build.txt; do
            if [ -s "$f" ]; then gh release upload "$TAG" "$f" --clobber || echo "skip $f"; fi
          done
