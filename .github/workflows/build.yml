name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-проект
        run: |
          flutter create --org ru.atomicpel --project-name cycle_app --platforms android .
          rm -f test/widget_test.dart
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="cycle_app"/android:label="Мой цикл"/' $MAN
          grep -q 'permission.INTERNET' $MAN || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MAN
          # Отключаем Impeller: на части Xiaomi/HyperOS он даёт чёрный экран
          sed -i 's|</application>|    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>|' $MAN
          cat $MAN
          # R8 вырезает методы плагинов, вызываемые через JNI — запрещаем
          cat > android/app/proguard-rules.pro <<'PRO'
          -keep class io.flutter.plugins.** { *; }
          -keep class dev.flutter.** { *; }
          -keep class com.github.dart_lang.jni.** { *; }
          -keep class kotlin.coroutines.** { *; }
          -keep class kotlinx.coroutines.** { *; }
          -keep class androidx.datastore.** { *; }
          PRO
          sed -i 's/^ *//' android/app/proguard-rules.pro
          cat android/app/proguard-rules.pro

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Анализ кода
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 && exit 0
          cat analyze.txt
          grep -E "^ *error" analyze.txt | head -10 | while read -r l; do echo "::error::$l"; done
          exit 1

      - name: Тесты
        run: |
          flutter test > test.txt 2>&1 && { tail -3 test.txt; exit 0; }
          cat test.txt
          grep -E "Error:|Expected:|Actual:|FAILED|failed" test.txt | head -10 | while read -r l; do echo "::error::$l"; done
          exit 1

      - name: Скриншоты экранов
        continue-on-error: true
        run: |
          cp "$(dirname "$(which flutter)")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" screenshot_test/
          flutter test screenshot_test --update-goldens
          ls -la screenshot_test/out

      - name: Сборка
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Подпись своим ключом
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          IN=$(find build/app/outputs -name '*release*.apk' | head -1)
          echo "::notice::apksigner=$APKSIGNER in=$IN files=$(ls signing | tr '\n' ' ')"
          set +e
          OUT=$("$APKSIGNER" sign --ks signing/release.jks --ks-key-alias cycle \
            --ks-pass file:signing/pass.txt \
            --out MyCycle.apk "$IN" 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "::error::apksigner rc=$RC: $(echo "$OUT" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          "$APKSIGNER" verify MyCycle.apk
          ls -la MyCycle.apk

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          SHOTS=(screenshot_test/out/*.png)
          gh release create "app-1.0.${{ github.run_number }}" MyCycle.apk "${SHOTS[@]}" \
            --title "Мой цикл 1.0.${{ github.run_number }}" \
            --notes "Сборка из ${{ github.sha }}"
