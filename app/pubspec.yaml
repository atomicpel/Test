name: cycle_app
description: "Мой цикл — календарь с синхронизацией через свой сервер"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: Unbounded
      fonts:
        - asset: fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: fonts/Unbounded-Bold.ttf
          weight: 700
    - family: Golos
      fonts:
        - asset: fonts/Golos-Regular.ttf
          weight: 400
        - asset: fonts/Golos-Medium.ttf
          weight: 500
        - asset: fonts/Golos-SemiBold.ttf
          weight: 600
        - asset: fonts/Golos-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: "icon.png"
  adaptive_icon_background: "#C2183F"
  adaptive_icon_foreground: "icon_fg.png"
